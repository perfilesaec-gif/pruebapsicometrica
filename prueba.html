<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prueba Psicométrica</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="header" id="header">
  <div class="header-inner">
    <div class="header-tag">Evaluación Psicométrica</div>
    <h1 id="title">Prueba</h1>
    <p id="subtitle"></p>
    <nav class="header-nav" id="backNav"><a href="index.html">← Volver al inicio</a></nav>
    <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progressBar"></div></div>
    <div class="progress-label" id="progressLabel"></div>
  </div>
</div>

<div class="container">

  <!-- PASO 1: datos y consentimiento -->
  <section id="stepStart">
    <div class="card">
      <h2>Datos de la persona evaluada</h2>
      <div class="form-row">
        <div class="form-group full">
          <label for="nombre">Nombres y apellidos *</label>
          <input type="text" id="nombre" autocomplete="name" placeholder="Ej: María González López">
        </div>
        <div class="form-group">
          <label for="documento">Cédula / Pasaporte</label>
          <input type="text" id="documento" inputmode="numeric" placeholder="Opcional">
        </div>
        <div class="form-group">
          <label for="correo">Correo electrónico</label>
          <input type="email" id="correo" autocomplete="email" placeholder="Opcional">
        </div>
        <div class="form-group full">
          <label for="cargo">Cargo al que postula *</label>
          <input type="text" id="cargo" placeholder="Ej: Analista de Talento Humano">
        </div>
      </div>
      <label class="consent">
        <input type="checkbox" id="consent">
        <span id="consentText"></span>
      </label>
    </div>

    <div class="instructions">
      <div class="instructions-icon">📋</div>
      <p id="instructions"></p>
    </div>

    <div class="submit-area">
      <div class="error-msg" id="startError"></div>
      <button class="btn" id="startBtn">Comenzar prueba →</button>
    </div>
  </section>

  <!-- PASO 2: ítems -->
  <section id="stepTest" class="hidden">
    <div class="instructions">
      <div class="instructions-icon">📋</div>
      <p id="instructions2"></p>
    </div>
    <div class="legend hidden" id="discLegend">
      <div class="legend-item"><div class="legend-dot mas"></div><span>MÁS — la que más le representa</span></div>
      <div class="legend-item"><div class="legend-dot menos"></div><span>MENOS — la que menos le representa</span></div>
    </div>
    <div class="counter-strip">
      <span>Progreso: <strong id="counterText"></strong></span>
      <span class="timer hidden" id="timer"></span>
      <span id="pendingText" style="color:var(--accent); font-weight:500;"></span>
    </div>
    <div id="items"></div>
    <div class="submit-area">
      <div class="error-msg" id="submitError"></div>
      <button class="btn" id="submitBtn">Enviar evaluación →</button>
    </div>
  </section>

  <!-- PASO 3: agradecimiento -->
  <section id="stepDone" class="hidden">
    <div class="success-screen">
      <div class="success-icon">✓</div>
      <h2>¡Evaluación completada!</h2>
      <p id="doneText"></p>
      <div class="btn-row" style="justify-content:center">
        <button class="btn secondary" id="downloadBtn">Descargar mis respuestas (.json)</button>
        <a class="btn" href="index.html">Volver al inicio</a>
      </div>
    </div>
  </section>
</div>

<script src="js/config.js"></script>
<script src="js/tests.js"></script>
<script src="js/common.js"></script>
<script>
const params = new URLSearchParams(location.search);
const test = TESTS[params.get('t')];
if (!test) location.replace('index.html');

const $ = id => document.getElementById(id);
let resp = [];           // respuestas por ítem
let startedAt = null;
let timerId = null;
let finished = false;
let candidato = null;
let record = null;

const totalItems = test.tipo === 'disc' ? test.grupos.length : test.items.length;
const unidad = test.tipo === 'disc' ? 'grupos' : 'preguntas';

// ---------- Paso 1 ----------
document.title = test.nombre;
$('header').dataset.watermark = test.corto.toUpperCase();
$('title').textContent = test.nombre;
$('subtitle').textContent = test.descripcion;
$('instructions').innerHTML = test.instrucciones;
$('instructions2').innerHTML = test.instrucciones;
$('consentText').innerHTML = `Autorizo a <strong>${esc(CONFIG.organizacion)}</strong> a tratar mis datos personales y los resultados de esta prueba con la finalidad exclusiva de evaluación dentro del proceso de selección, conforme a la Ley Orgánica de Protección de Datos Personales del Ecuador. Entiendo que los resultados son confidenciales, complementarios y no serán usados con fines discriminatorios, y que puedo ejercer mis derechos de acceso, rectificación, eliminación y oposición escribiendo a <a href="mailto:${esc(CONFIG.contactoDatos)}">${esc(CONFIG.contactoDatos)}</a>. *`;
updateProgress();

$('startBtn').onclick = () => {
  const nombre = $('nombre').value.trim();
  const cargo = $('cargo').value.trim();
  const err = $('startError');
  if (!nombre || !cargo) { err.style.display = 'block'; err.textContent = 'Por favor complete sus nombres y el cargo al que postula.'; return; }
  if (!$('consent').checked) { err.style.display = 'block'; err.textContent = 'Para continuar es necesario aceptar el consentimiento de tratamiento de datos.'; return; }
  candidato = { nombre, cargo, documento: $('documento').value.trim(), correo: $('correo').value.trim() };
  $('stepStart').classList.add('hidden');
  $('stepTest').classList.remove('hidden');
  $('backNav').classList.add('hidden');
  buildItems();
  startedAt = Date.now();
  if (test.tiempoLimite) startTimer();
  window.scrollTo({ top: 0, behavior: 'smooth' });
};

window.addEventListener('beforeunload', e => {
  if (startedAt && !finished) { e.preventDefault(); e.returnValue = ''; }
});

// ---------- Paso 2 ----------
function buildItems() {
  const box = $('items');
  if (test.tipo === 'disc') {
    $('discLegend').classList.remove('hidden');
    resp = test.grupos.map(() => ({}));
    box.className = 'groups-grid';
    box.innerHTML = test.grupos.map((g, gi) => `
      <div class="group-card" id="item-${gi}">
        <div class="group-header"><span class="group-num">${gi + 1}</span><span class="group-status" id="status-${gi}">Sin completar</span></div>
        <div class="group-cols">
          <div class="col-header">Palabras</div><div class="col-header mas">MÁS</div><div class="col-header menos">MENOS</div>
          ${g.map((w, wi) => `
            <div class="word-label">${esc(w[0])}</div>
            <div class="word-cell"><input type="radio" class="disc-radio mas-radio" name="mas-${gi}" value="${wi}" aria-label="Más: ${esc(w[0])}" data-g="${gi}" data-k="mas"></div>
            <div class="word-cell"><input type="radio" class="disc-radio menos-radio" name="menos-${gi}" value="${wi}" aria-label="Menos: ${esc(w[0])}" data-g="${gi}" data-k="menos"></div>
          `).join('')}
        </div>
      </div>`).join('');
  } else {
    resp = test.items.map(() => null);
    // Ítems con opciones propias (ejercicios o casos) se muestran como a), b), c)…; el resto usa la escala Likert
    const opt = (i, v, lbl) => `<label class="opt"><input type="radio" name="q-${i}" value="${v}" data-g="${i}"><span>${lbl}</span></label>`;
    const opts = (it, i) => it.o
      ? it.o.map((o, v) => opt(i, v, `${String.fromCharCode(97 + v)}) ${esc(typeof o === 'string' ? o : o.t)}`)).join('')
      : test.escala.map((lbl, v) => opt(i, v, esc(lbl))).join('');
    box.innerHTML = test.items.map((it, i) => `
      <div class="item-card" id="item-${i}">
        <div class="item-text"><span class="n">${i + 1}.</span>${esc(it.t)}</div>
        <div class="options ${it.o ? (it.o.some(o => typeof o !== 'string') ? 'stacked' : '') : 'likert'}">${opts(it, i)}</div>
      </div>`).join('');
  }
  box.addEventListener('change', onChange);
  updateProgress();
}

function onChange(e) {
  const el = e.target;
  const g = +el.dataset.g, v = +el.value;
  if (test.tipo === 'disc') {
    const k = el.dataset.k, other = k === 'mas' ? 'menos' : 'mas';
    if (resp[g][other] === v) {
      document.querySelectorAll(`input[name="${other}-${g}"]`).forEach(r => r.checked = false);
      delete resp[g][other];
    }
    resp[g][k] = v;
    const r = resp[g];
    $('status-' + g).textContent = isDone(r) ? '✓ Completado' : r.mas !== undefined ? 'Falta MENOS' : 'Falta MÁS';
  } else {
    resp[g] = v;
  }
  const card = $('item-' + g);
  card.classList.remove('error');
  card.classList.toggle('complete', isDone(resp[g]));
  updateProgress();
}

function isDone(r) {
  return test.tipo === 'disc' ? r && r.mas !== undefined && r.menos !== undefined : r !== null && r !== undefined;
}

function updateProgress() {
  const done = resp.filter(isDone).length;
  $('progressBar').style.width = (done / totalItems * 100) + '%';
  $('progressLabel').textContent = `${done} de ${totalItems} ${unidad} completados`;
  $('counterText').textContent = `${done} / ${totalItems}`;
  const pending = totalItems - done;
  $('pendingText').textContent = pending ? `${pending} pendientes` : '¡Todo completado!';
  $('pendingText').style.color = pending ? 'var(--accent)' : 'var(--mas)';
}

function startTimer() {
  const t = $('timer');
  t.classList.remove('hidden');
  const tick = () => {
    const left = Math.max(0, test.tiempoLimite - Math.floor((Date.now() - startedAt) / 1000));
    t.textContent = '⏱ ' + String(Math.floor(left / 60)).padStart(2, '0') + ':' + String(left % 60).padStart(2, '0');
    t.classList.toggle('low', left <= 60);
    if (left === 0) { clearInterval(timerId); finish(true); }
  };
  tick();
  timerId = setInterval(tick, 1000);
}

$('submitBtn').onclick = () => {
  const missing = [];
  resp.forEach((r, i) => { if (!isDone(r)) { missing.push(i + 1); $('item-' + i).classList.add('error'); } });
  if (missing.length) {
    const err = $('submitError');
    err.style.display = 'block';
    err.textContent = `Faltan ${missing.length} ${unidad} por completar: ${missing.join(', ')}.` + (test.tipo === 'disc' ? ' Cada grupo necesita una selección MÁS y una MENOS.' : '');
    $('item-' + (missing[0] - 1)).scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  finish(false);
};

// ---------- Paso 3 ----------
async function finish(porTiempo) {
  if (finished) return;
  finished = true;
  clearInterval(timerId);
  const respuestas = test.tipo === 'choice' ? resp.map(r => r ?? null) : resp;
  record = {
    id: newId(),
    prueba: test.id,
    pruebaNombre: test.nombre,
    candidato,
    fecha: new Date().toISOString(),
    duracionSeg: Math.round((Date.now() - startedAt) / 1000),
    finalizadaPorTiempo: porTiempo,
    respuestas,
    resultado: test.score(respuestas)
  };
  addResult(record);
  const enviado = await sendToEndpoint(record);

  $('stepTest').classList.add('hidden');
  $('stepDone').classList.remove('hidden');
  $('progressBar').style.width = '100%';
  $('progressLabel').textContent = 'Evaluación enviada ✓';
  $('doneText').innerHTML = (porTiempo ? 'El tiempo de la prueba ha concluido. ' : '') +
    `Gracias, <strong>${esc(candidato.nombre)}</strong>. Sus respuestas para el cargo de <strong>${esc(candidato.cargo)}</strong> han sido registradas.` +
    (enviado ? ' El equipo de Talento Humano las recibió y se comunicará con usted.' :
      ' Si rindió la prueba desde su propio dispositivo, descargue su archivo de respuestas y envíelo a Talento Humano según las indicaciones recibidas.');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

$('downloadBtn').onclick = () => {
  downloadFile(`${test.id}_${slug(candidato.nombre)}.json`, JSON.stringify(record, null, 2), 'application/json');
};
</script>
</body>
</html>
